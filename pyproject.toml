[project]
name = "cascade"
version = "0.1.0"
description = "Cost-aware routing of models and reasoning effort for agentic GitHub issue resolution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "openai-agents==0.23.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "typer==0.27.2",
]

[project.scripts]
cascade = "cascade.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyright==1.1.414",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascade"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "E501"]  # long literals and test ids read better unwrapped

[tool.pyright]
include = ["cascade", "tests"]
exclude = ["tests/fixtures"]
pythonVersion = "3.11"
strict = ["cascade"]
reportMissingTypeStubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: end-to-end smoke test on the synthetic fixture repo (mock provider, $0)",
    "docker: needs a running Docker daemon and a locally available image; skipped otherwise",
]
