# TODO(human): fill in every TODO before any non-mock run. `uv run cascade config-status` lists
# what is left. Model names and arm definitions below are from the human's Phase 4 brief; every
# price, cutoff, and pricing rule is still yours to fill from the provider's pricing page (hard
# rule 5: nothing here is a guess, nothing is defaulted).
#
# - name: the provider's model identifier, exactly as its docs list it.
# - *_usd_per_mtok: USD per million tokens from the provider's current pricing page.
# - reasoning_usd_per_mtok: leave null if reasoning tokens bill at the output price.
# - cached_input_usd_per_mtok / cache_write_usd_per_mtok: only if the provider bills them
#   differently from plain input; otherwise leave unset (cached tokens then bill as input, which
#   can only overstate cost).
# - long_context_threshold_tokens + long_context_input_multiplier + long_context_output_multiplier:
#   only if the provider charges more for a call whose input exceeds a size. A call over the
#   threshold then bills input and output at those multiples. Unset means no such rule.
# - flex_multiplier: the price multiple for service_tier=flex (the brief expects 0.5), set ONLY after
#   confirming on the pricing page that the model supports flex. null means flex is unavailable.
# - knowledge_cutoff: from the provider docs. Task PRs must be merged AFTER the newest cutoff
#   (see date_window in repos.yaml).
# - reasoning_efforts: the effort values this model accepts; [] if it has no effort setting.
#
# An arm is (model, reasoning effort) applied to the whole pipeline. `label` is the short role name
# budget.yaml and the CLI use. Arms are run cheapest-first in the order listed. An `optional: true`
# arm NEVER runs unless you add `enabled: true` to it.
