# TODO(human): pick the first repo and set the date window. Candidate criteria (docs/SPEC.md):
# Python + pytest, permissive license, active, mid-popularity, installs without a GPU, test suite
# under ~2 minutes.
date_window:
  # PRs must be merged after the newest arm's knowledge cutoff in models.yaml.
  start: TODO   # YYYY-MM-DD
  end: TODO     # YYYY-MM-DD

limits:
  min_source_files: 1
  max_source_files: 5
  max_source_lines: 150
  max_test_runtime_s: 120

repos:
  - name: pallets/click
    license: BSD-3-Clause        # checked against GitHub's licenseInfo.spdxId at mine time
    # Pinned exact patch release (uv python install). click's own CI matrix covers 3.10-3.14 and
    # its pytest config turns warnings into errors, so a fixed interpreter matters.
    python_version: "3.12.13"
    # Runs at image build time (network on) with the repo at /workspace: editable install plus the
    # `tests` dependency group. Editable matters: click's tests call importlib.metadata.
    install_cmd: uv pip install --group tests -e .
    test_cmd: python -m pytest   # pytest picks up click's own config (testpaths, markers)
    notes: "src/ layout, flit_core backend; ~2.2k tests in ~5s natively (measured 2026-10-04)."
